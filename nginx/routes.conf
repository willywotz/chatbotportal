# Shared routing contract, included by both the HTTP (8080) and TLS (8443)
# servers in default.conf / tls.conf.template — single source of truth:
#   /api,/sse,/messages,/mcp,/docs,/redoc,/openapi.json -> backend:8080
#     (/api/v1/responses also serves a WebSocket; see the exact-match location)
#   /jaeger/                                             -> jaeger:16686
#   /                                                    -> frontend:8080 (SPA; see frontend/nginx.conf)
# See docs/superpowers/specs/2026-06-23-system-ci-refactor-design.md

client_max_body_size 20M;

# OpenAI Responses API. The WebSocket transport holds a connection for up to
# 60 minutes (RESPONSES_WS_MAX_DURATION_SECONDS), so the 300s read timeout
# the other /api routes use would kill an idle socket well before the cap.
location = /api/v1/responses {
    proxy_pass         http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-Host $http_host;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;

    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 3700s;
    proxy_send_timeout 3700s;
}

location ~ ^/(api|sse|messages|mcp|docs|redoc|openapi.json) {
    proxy_pass         http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-Host $http_host;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;

    proxy_buffering    off;
    proxy_cache        off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location /jaeger/ {
    proxy_pass http://jaeger:16686;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

location / {
    proxy_pass http://frontend:8080;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
}
