[project]
name = "ai-chatbot-backend"
version = "1.0.0"
description = "AI Chatbot Portal Backend — FastAPI + SQLAlchemy 2 + Alembic + FastMCP"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Async HTTP client
    "httpx>=0.27.0",
    # YAML parsing for OpenAPI specs
    "pyyaml>=6.0.0",
    # ORM + PostgreSQL async driver
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    # Migrations
    "alembic>=1.13.0",
    # MCP server
    "fastmcp>=2.3.0",
    # Settings / env
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    # Auth — password hashing
    "email-validator>=2.1.0",   # pydantic EmailStr support
    "bcrypt>=5.0.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.41.1",
    "opentelemetry-instrumentation-fastapi>=0.62b1",
    "opentelemetry-instrumentation-httpx>=0.62b1",
    "tzdata>=2026.2",
    "cachetools>=7.0.5",
    "apscheduler>=3.11.2",
    "pytz>=2026.1.post1",
    "pyjwt[crypto]>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",   # also used as AsyncClient test transport
    "testcontainers[postgres]>=4.0.0",
]

#[project.scripts]
#serve = "uvicorn app.main:asgi_app --reload"

# ---------------------------------------------------------------------------
# uv
# ---------------------------------------------------------------------------
[tool.uv]
package = false          # not a library — no build step needed

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = []
