apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: chatbotportal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: ghcr.io/willywotz/chatbotportal-web:v0.1.0
          ports:
            - containerPort: 8080
          env:
            - name: API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: chatbotportal-config
                  key: API_BASE_URL
            - name: OIDC_AUTHORITY
              valueFrom:
                configMapKeyRef:
                  name: chatbotportal-config
                  key: OIDC_AUTHORITY
            - name: OIDC_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: chatbotportal-config
                  key: OIDC_CLIENT_ID
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: chatbotportal
spec:
  selector:
    app: web
  ports:
    - port: 8080
      targetPort: 8080
