apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: chatbotportal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done"
      containers:
        - name: backend
          image: ghcr.io/willywotz/chatbotportal:v0.1.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: chatbotportal-config
            - secretRef:
                name: chatbotportal-secrets
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: chatbotportal
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
