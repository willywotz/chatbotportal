[defaults]
inventory = inventory/prod.yml
collections_path = ./.ansible/collections
host_key_checking = True
retry_files_enabled = False
# yaml-formatted task results via the builtin callback (the old community.general.yaml
# callback was removed in community.general 12.0.0 — result_format is its replacement)
result_format = yaml
# community.sops.sops vars plugin auto-decrypts *.sops.yaml in group_vars/host_vars
vars_plugins_enabled = host_group_vars,community.sops.sops

[ssh_connection]
# Keep the SSH channel alive during long, silent tasks (first-time `docker compose
# pull` runs for minutes with no channel output; without keepalive a NAT/firewall
# idle-timeout severs the connection → UNREACHABLE). 30s * 20 = ~10 min of silence.
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30 -o ServerAliveCountMax=20
