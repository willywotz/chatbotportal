[defaults]
inventory = inventory/prod.yml
collections_path = ./.ansible/collections
host_key_checking = True
retry_files_enabled = False
# yaml-formatted task results via the builtin callback (the old community.general.yaml
# callback was removed in community.general 12.0.0 — result_format is its replacement)
result_format = yaml
# community.sops.sops vars plugin auto-decrypts *.sops.yaml in group_vars/host_vars
vars_plugins_enabled = host_group_vars,community.sops.sops
