<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  body { font-family:'Sarabun',sans-serif; background:radial-gradient(700px 500px at 85% 15%, hsla(205,90%,60%,.5), transparent 60%), linear-gradient(160deg, hsl(213,72%,52%) 0%, hsl(215,60%,32%) 60%, hsl(217,55%,20%) 100%); color:#fff; position:relative; }
  .content { position:absolute; inset:0; display:flex; align-items:center; }
  .left { width:560px; padding:0 0 0 84px; }
  .brand { display:flex; align-items:center; gap:16px; font-size:25px; font-weight:700; }
  .brand .logo { width:52px; height:52px; border-radius:15px; background:#fff; color:hsl(213,72%,48%); display:flex; align-items:center; justify-content:center; font-size:28px; box-shadow:0 8px 22px hsla(215,70%,8%,.4); }
  h1 { font-size:82px; font-weight:800; line-height:1.08; margin-top:34px; letter-spacing:-1px; }
  p { margin-top:24px; font-size:28px; font-weight:300; line-height:1.5; color:hsla(0,0%,100%,.9); max-width:490px; }
  .url { margin-top:34px; font-size:21px; font-weight:600; color:hsla(0,0%,100%,.72); }
  .right { flex:1; display:flex; justify-content:center; align-items:center; }
  .card { width:440px; background:#fff; border-radius:28px; padding:30px 28px; box-shadow:0 40px 80px hsla(217,70%,8%,.5); color:hsl(215,25%,18%); transform:rotate(-3deg); }
  .row { display:flex; margin-bottom:18px; }
  .bubble { padding:15px 20px; border-radius:20px; font-size:22px; font-weight:400; line-height:1.45; max-width:90%; }
  .q { margin-left:auto; background:hsl(213,70%,45%); color:#fff; border-bottom-right-radius:6px; }
  .a { background:hsl(210,36%,95%); color:hsl(215,25%,20%); border-bottom-left-radius:6px; }
  .tag { display:inline-flex; align-items:center; gap:8px; margin-top:12px; padding:7px 15px; border-radius:999px; background:hsl(145,55%,40%); color:#fff; font-size:17px; font-weight:600; }
  .typing { display:flex; gap:6px; padding:16px 20px; }
  .typing i { width:9px; height:9px; border-radius:50%; background:hsl(215,15%,65%); }
</style>
</head>
<body>
  <div class="content">
    <div class="left">
      <div class="brand"><span class="logo">💬</span>Agentic AI Chatbot</div>
      <h1>เรื่องราชการ<br>ง่ายนิดเดียว</h1>
      <p>แชตเดียว ครบทุกหน่วยงาน ระบบ AI ตอบคำถามด้วยภาษาที่เข้าใจง่าย</p>
    </div>
    <div class="right">
      <div class="card">
        <div class="row"><div class="bubble q">ต่ออายุบัตรประชาชนทำยังไง?</div></div>
        <div class="row"><div class="bubble a">ไปที่ที่ว่าการอำเภอ (กรมการปกครอง) เตรียมเอกสารตามนี้…
          <div class="tag">🪪 ส่งต่อ กรมการปกครอง</div>
        </div></div>
        <div class="row"><div class="bubble a typing"><i></i><i></i><i></i></div></div>
      </div>
    </div>
  </div>
</body>
</html>
