services:

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatbot_secret}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatbot} -d ${POSTGRES_DB:-chatbot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports: ["${EXTERNAL_POSTGRES_PORT:-${POSTGRES_PORT:-}}:5432"]

  backend:
    build: {context: ./backend, target: production}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy, restart: true}
      jaeger: {condition: service_started}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-chatbot}:${POSTGRES_PASSWORD:-chatbot_secret}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-chatbot}
      CORS_ORIGINS: ${CORS_ORIGINS:-["*"]}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:${HTTP_PORT:-8080}}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-chatbotportal-web}
      OIDC_ALLOWED_REDIRECT_URIS: ${OIDC_ALLOWED_REDIRECT_URIS:-["http://localhost:${HTTP_PORT:-8080}/auth/callback"]}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin1234}
    volumes: [agency-uploads:/app/uploads]

  web:
    build: {context: ./web, target: production}
    restart: unless-stopped
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:${HTTP_PORT:-8080}}
      OIDC_AUTHORITY: ${OIDC_AUTHORITY:-${OIDC_ISSUER:-http://localhost:${HTTP_PORT:-8080}}}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-chatbotportal-web}

  jaeger:
    image: jaegertracing/jaeger:2.18.0
    restart: unless-stopped
    command:
      - "--set=extensions.jaeger_query.base_path=/jaeger"
      - "--set=extensions.jaeger_storage.backends.some_storage.memory.max_traces=1000"

  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   environment:
  #     SITE_ADDRESS: ${CERT_DOMAIN:-:80}
  #     CERT_EMAIL: ${CERT_EMAIL:-}
  #   volumes:
  #     - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     backend: {condition: service_healthy, restart: true}
  #     web: {condition: service_healthy, restart: true}
  #     jaeger: {condition: service_started}
  #   ports:
  #     - "${EXTERNAL_HTTP_PORT:-${HTTP_PORT:-8080}}:80"
  #     - "${EXTERNAL_HTTPS_PORT:-${HTTPS_PORT:-8443}}:443"

  nginx:
    build: {context: ./deploy/nginx}
    restart: unless-stopped
    ports: ["${HTTP_PORT:-8080}:8080"]

volumes:
  postgres_data:
  agency-uploads:
