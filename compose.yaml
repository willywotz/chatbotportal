services:

  postgres:
    image: groonga/pgroonga:4.0.8-debian-17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatbot}
      POSTGRES_USER: ${POSTGRES_USER:-chatbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chatbot_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatbot} -d ${POSTGRES_DB:-chatbot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - target: 5432
        published: "${EXTERNAL_POSTGRES_PORT:-}"

  backend:
    image: ghcr.io/willywotz/chatbotportal:${IMAGE_TAG:-latest}
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-chatbot}:${POSTGRES_PASSWORD:-chatbot_secret}@${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-chatbot}
      ENV: ${ENV:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-["*"]}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8080/auth}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080/auth}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-chatbotportal}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-portal-spa}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-backend}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:-portal-admin}
      # Dev default matches the portal-admin secret in deploy/keycloak/realm-export.json
      # so the user-management proxy works out of the box. PROD MUST override this.
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-portal-admin-dev-secret}
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
      jaeger:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - backend-uv-cache:/root/.cache/uv
      - agency-uploads:/app/uploads

  frontend:
    image: ghcr.io/willywotz/chatbotportal-web:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      target: production
      args:
        # Vite inlines these at build time. Public /auth origin (browser-facing);
        # must equal KEYCLOAK_URL. Prod: override to https://<domain>/auth.
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8080/auth}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-chatbotportal}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-portal-spa}
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-}"
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - frontend-pnpm-store:/pnpm/store

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # Drives the Caddyfile site address. Defaults to ":80" (plain HTTP, local
      # dev). Set CERT_DOMAIN to the public hostname to enable auto-HTTPS.
      # Never empty — Caddy's site address must always resolve to a real value.
      SITE_ADDRESS: ${CERT_DOMAIN:-:80}
      CERT_EMAIL: ${CERT_EMAIL:-}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
        restart: true
      backend:
        condition: service_healthy
        restart: true
      jaeger:
        condition: service_started
    networks:
      - chatbot-network
    ports:
      - target: 80
        published: "${EXTERNAL_HTTP_PORT:-}"
      - target: 443
        published: "${EXTERNAL_HTTPS_PORT:-}"

  jaeger:
    image: jaegertracing/jaeger:2.18.0
    restart: unless-stopped
    networks:
      - chatbot-network
    command:
      - "--set=extensions.jaeger_query.base_path=/jaeger"
      - "--set=storage.memory.max_traces=1000"

  # Behind Caddy (no published host port) — reached by the browser at /auth via
  # the gateway, and by the backend directly on the network (KEYCLOAK_INTERNAL_URL).
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_PASSWORD:-admin}
      # Serve under /auth so it shares the gateway origin with the SPA and API.
      KC_HTTP_RELATIVE_PATH: /auth
      # Trust Caddy's X-Forwarded-* so issued URLs (incl. the token issuer) use
      # the public origin. start-dev derives the hostname from these headers; a
      # hardened prod (start mode) should also set KC_HOSTNAME to the public URL.
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./deploy/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - chatbot-network

volumes:
  postgres_data:
  backend-uv-cache:
  agency-uploads:
  frontend-pnpm-store:
  caddy_data:
  caddy_config:

networks:
  chatbot-network:
