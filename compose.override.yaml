# Local development override. Auto-merged by `docker compose up --watch`, so a
# single command runs the full dev stack with hot-reload.
#
# Hot-reload uses Compose `develop.watch` (sync actions), NOT bind-mounts:
# edited files are copied into the running container on watch, avoiding the
# WSL2 cross-filesystem bind issues and host `node_modules` clobbering that
# bind-mounts cause. Trade-off: hot-reload only activates under `--watch` — a
# plain `docker compose up` runs the baked dev image without syncing edits.
#
# NEVER reaches prod: .github/workflows/deploy.yml invokes
# `docker compose -f compose.yaml up`, and an explicit `-f` disables
# automatic override merging. Keep this file additive — override only what dev
# needs (build target + watch rules); do not redefine routing, volumes, or
# ports that the base file owns.
#
# See docs/development.md.

services:

  backend:
    build:
      target: development
    develop:
      watch:
        # Dependency changes -> rebuild the image (sync can't add packages).
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./backend/uv.lock
        # Migrations change rarely but need a restart to apply; sync+restart
        # copies the file then restarts the process.
        - action: sync+restart
          path: ./backend/migrations
          target: /app/migrations
        # App source -> sync in place. fastapi dev's watchfiles then reloads
        # uvicorn on the changed .py files.
        - action: sync
          path: ./backend/app
          target: /app/app

  frontend:
    build:
      target: development
    environment:
      # Same-origin through Caddy: the browser hits the gateway origin, which
      # proxies /api -> backend. Empty = window.location.origin.
      VITE_API_BASE_URL: ""
    # Vite dev server has no /healthz route (that lives in the production
    # nginx.conf); probe "/" instead so the container becomes healthy and Caddy
    # (depends_on: frontend healthy) starts.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    develop:
      watch:
        # Dependency changes -> rebuild (pnpm install runs in the image build).
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/pnpm-lock.yaml
        # Source -> sync. Vite's HMR picks up the change and pushes an update.
        - action: sync
          path: ./frontend/src
          target: /app/src
