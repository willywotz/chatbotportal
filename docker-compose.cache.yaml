# Deploy-only build-cache overlay. Layered on top of docker-compose.yaml by the
# Deploy workflow (never by local `docker compose up`, which uses the default
# builder that cannot export local cache). Persists BuildKit *layer* cache to a
# host directory so a `docker system prune`, disk GC, or daemon restart no longer
# forces a cold dependency reinstall. Requires COMPOSE_BAKE=true and a
# container-driver buildx builder (see deploy.yml).
services:
  backend:
    build:
      cache_from:
        - type=local,src=${BUILDCACHE_DIR:-/opt/deploy-buildcache}/backend
      cache_to:
        - type=local,dest=${BUILDCACHE_DIR:-/opt/deploy-buildcache}/backend,mode=max

  agent-proxy:
    build:
      cache_from:
        - type=local,src=${BUILDCACHE_DIR:-/opt/deploy-buildcache}/agent-proxy
      cache_to:
        - type=local,dest=${BUILDCACHE_DIR:-/opt/deploy-buildcache}/agent-proxy,mode=max

  frontend:
    build:
      cache_from:
        - type=local,src=${BUILDCACHE_DIR:-/opt/deploy-buildcache}/frontend
      cache_to:
        - type=local,dest=${BUILDCACHE_DIR:-/opt/deploy-buildcache}/frontend,mode=max
